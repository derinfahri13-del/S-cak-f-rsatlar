name: Sicak Firsatlar Bot

on:
  schedule:
    - cron: "*/5 * * * *"    # her 5 dakikada bir (GitHub'ın desteklediği en kısa aralık)
  workflow_dispatch: {}        # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py

      - name: Görülen konuları kaydet (commit)
        run: |
          git config user.name "da-bot"
          git config user.email "da-bot@users.noreply.github.com"
          git add seen_topics.json
          git diff --staged --quiet || git commit -m "seen_topics güncellendi"
          git push
